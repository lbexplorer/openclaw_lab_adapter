llm:
  api_key_envs:
    - MOONSHOT_API_KEY
    - KIMI_API_KEY
    - OPENCLAW_LLM_API_KEY
    - OPENAI_API_KEY
  base_url_env: OPENCLAW_LLM_BASE_URL
  model_env: OPENCLAW_LLM_MODEL
  default_base_url: https://api.moonshot.cn/v1
  default_model: kimi-k2.5
  timeout_seconds: 30

agent:
  max_actions: 3
  async_result_timeout_seconds: 10
  async_result_poll_seconds: 1
  service_preflight_timeout_seconds: 20
  service_preflight_poll_seconds: 1
  skill_timeouts:
    default_execute_seconds: 60
    default_status_seconds: 15
    scout_navigation_manager:
      execute_seconds: 30
      status_seconds: 15
    scout_move_control:
      execute_seconds: 30
      status_seconds: 15
    patrol_fixed_points:
      execute_seconds: 600
      status_seconds: 15
    check_person_detected:
      execute_seconds: 10
      status_seconds: 5
    trigger_existing_tracking_handoff:
      execute_seconds: 10
      status_seconds: 5
  confirmation_policy:
    always_confirm_navigation: true
    always_confirm_multi_step_move: true
    simple_move_max_seconds: 1.0
    direct_actions:
      - stop

skills:
  scout_navigation_manager:
    enabled: true
    description: "将地点类自然语言映射到命名导航点，并调用导航客户端发送目标。"
    capabilities:
      - "命名地点导航"
      - "列出当前可到达地点"
      - "说明导航 target 参数含义"
    query_keywords:
      - "导航"
      - "地点"
      - "去哪"
      - "waypoint"
    examples:
      - "带我去前台"
      - "去实验台"
      - "有哪些可到达地点"
    risk_level: high
    status_supported: true
    arguments:
      target: "命名点名称，例如 原点、接待区、实验台、物料区、巡检点A"

  scout_move_control:
    enabled: true
    description: "将简短运动意图转换为底盘动作命令，并调用移动控制客户端下发字符串命令。"
    capabilities:
      - "前进、后退、左转、右转、停止"
      - "支持 command 参数为单条或逗号分隔动作串"
      - "说明动作命令格式与执行约束"
    query_keywords:
      - "移动"
      - "底盘"
      - "前进"
      - "停止"
      - "move"
    examples:
      - "前进1秒"
      - "左转0.5秒"
      - "停止"
      - "前进1秒，然后左转1秒"
    risk_level: low
    status_supported: true
    arguments:
      command: "动作命令字符串，例如 forward 1, left 1, stop 0.5"

  patrol_fixed_points:
    enabled: true
    description: "按固定巡逻点顺序调用导航 skill，完成大车固定点巡逻 Demo 流程。"
    capabilities:
      - "默认路线：原点、巡逻点2、巡逻点3、巡逻点4、原点"
      - "按顺序等待每个导航点完成后再下发下一个点"
      - "返回当前巡逻状态、当前点、已完成点和失败点"
    query_keywords:
      - "巡逻"
      - "固定点"
      - "patrol"
    examples:
      - "开始巡逻"
      - "按默认路线巡逻"
      - "执行固定点巡逻"
    risk_level: high
    status_supported: true
    arguments:
      action: "巡逻操作，支持 run、status、stop；默认 run"
      patrol_points: "逗号分隔巡逻点名称，留空或 default 表示默认路线"
      loop: "是否循环巡逻，当前 Demo 阶段默认 false"
      stop_on_detection: "检测到人员后是否停止巡逻，当前预留，默认 false"

  check_person_detected:
    enabled: true
    description: "读取已有人员检测 ROS topic，判断当前是否检测到静态人员，不启动或重写检测模型。"
    capabilities:
      - "默认读取 /track_pose，判断是否已有可用于协同下发的人员目标位姿"
      - "可读取 /DetectMsg，按 person 类别和置信度阈值判断是否检测到人员"
      - "返回人员检测状态、目标 pose、检测框、topic 和等待超时信息"
    query_keywords:
      - "人员检测"
      - "检测人员"
      - "有没有人"
      - "person"
      - "detect"
    examples:
      - "检查是否检测到人员"
      - "现在有没有检测到人"
      - "查询人员检测状态"
    risk_level: low
    status_supported: true
    arguments:
      source: "检测结果来源，支持 track_pose、detect_msg、auto；默认 track_pose"
      topic: "可选，覆盖默认 topic；track_pose 默认 /track_pose，detect_msg 默认 /DetectMsg"
      timeout_seconds: "等待检测消息的超时时间，默认 3 秒"
      confidence_threshold: "读取 /DetectMsg 时的人员置信度阈值，默认 0.5"

  trigger_existing_tracking_handoff:
    enabled: true
    description: "确认大车侧人员目标已进入现有大车到小车协同交接链路，不主动发布新指令。"
    capabilities:
      - "默认读取 /track_pose，确认现有人员目标 pose 已出现"
      - "可检查 /track_pose 是否已有 subscriber，用于判断现有 bridge 或协同链路是否接入"
      - "返回 target_pose、topic、subscriber 状态和 handoff 结果"
    query_keywords:
      - "协同"
      - "交接"
      - "小车跟踪"
      - "handoff"
      - "tracking"
    examples:
      - "触发小车协同跟踪"
      - "确认目标已经交给小车"
      - "查询协同交接状态"
    risk_level: low
    status_supported: true
    arguments:
      action: "交接操作，支持 check、status；默认 check"
      topic: "可选，覆盖默认 topic；默认 /track_pose"
      timeout_seconds: "等待目标 pose 的超时时间，默认 3 秒"
      require_subscriber: "是否要求 /track_pose 已有 subscriber，默认 false"
