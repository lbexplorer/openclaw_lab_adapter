llm:
  api_key_envs:
    - MOONSHOT_API_KEY
    - KIMI_API_KEY
    - OPENCLAW_LLM_API_KEY
    - OPENAI_API_KEY
  base_url_env: OPENCLAW_LLM_BASE_URL
  model_env: OPENCLAW_LLM_MODEL
  default_base_url: https://api.moonshot.cn/v1
  default_model: kimi-k2.5
  timeout_seconds: 30

agent:
  max_actions: 3
  async_result_timeout_seconds: 10
  async_result_poll_seconds: 1
  skill_timeouts:
    default_execute_seconds: 60
    default_status_seconds: 15
    scout_navigation_manager:
      execute_seconds: 30
      status_seconds: 15
    scout_move_control:
      execute_seconds: 30
      status_seconds: 15
    patrol_fixed_points:
      execute_seconds: 600
      status_seconds: 15
  confirmation_policy:
    always_confirm_navigation: true
    always_confirm_multi_step_move: true
    simple_move_max_seconds: 1.0
    direct_actions:
      - stop

skills:
  scout_navigation_manager:
    enabled: true
    description: "将地点类自然语言映射到命名导航点，并调用导航客户端发送目标。"
    capabilities:
      - "命名地点导航"
      - "列出当前可到达地点"
      - "说明导航 target 参数含义"
    query_keywords:
      - "导航"
      - "地点"
      - "去哪"
      - "waypoint"
    examples:
      - "带我去前台"
      - "去实验台"
      - "有哪些可到达地点"
    risk_level: high
    status_supported: true
    arguments:
      target: "命名点名称，例如 原点、接待区、实验台、物料区、巡检点A"

  scout_move_control:
    enabled: true
    description: "将简短运动意图转换为底盘动作命令，并调用移动控制客户端下发字符串命令。"
    capabilities:
      - "前进、后退、左转、右转、停止"
      - "支持 command 参数为单条或逗号分隔动作串"
      - "说明动作命令格式与执行约束"
    query_keywords:
      - "移动"
      - "底盘"
      - "前进"
      - "停止"
      - "move"
    examples:
      - "前进1秒"
      - "左转0.5秒"
      - "停止"
      - "前进1秒，然后左转1秒"
    risk_level: low
    status_supported: true
    arguments:
      command: "动作命令字符串，例如 forward 1, left 1, stop 0.5"

  patrol_fixed_points:
    enabled: true
    description: "按固定巡逻点顺序调用导航 skill，完成大车固定点巡逻 Demo 流程。"
    capabilities:
      - "默认路线：原点、巡逻点2、巡逻点3、巡逻点4、原点"
      - "按顺序等待每个导航点完成后再下发下一个点"
      - "返回当前巡逻状态、当前点、已完成点和失败点"
    query_keywords:
      - "巡逻"
      - "固定点"
      - "patrol"
    examples:
      - "开始巡逻"
      - "按默认路线巡逻"
      - "执行固定点巡逻"
    risk_level: high
    status_supported: true
    arguments:
      action: "巡逻操作，支持 run、status、stop；默认 run"
      patrol_points: "逗号分隔巡逻点名称，留空或 default 表示默认路线"
      loop: "是否循环巡逻，当前 Demo 阶段默认 false"
      stop_on_detection: "检测到人员后是否停止巡逻，当前预留，默认 false"
